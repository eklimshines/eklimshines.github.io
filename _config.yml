          **Cloud-based Personalized Infotainment System** — KEIT · May 2016 – Dec 2016<br>
          *Embedded C · solo · 100% contribution*

          - Collected vehicle data over OBD-II and streamed it to the cloud in real time.
          - On critical events (e.g., hazard lights on after an accident), uploaded photos and 10 seconds of video to the cloud.

          **Vehicle Authentication & Predictive Maintenance Platform using OTP-based HSM** — MOTIE · Dec 2015 – Nov 2016

