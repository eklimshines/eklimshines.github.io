about_content: | # this will include new lines to allow paragraphs
  Hi, I'm MinJae — a cross-platform application developer with ~10 years of experience across desktop, mobile, embedded systems and security research.

  At **bHaptics** I own the flagship desktop app, *bHaptics Player*, across three generations (C#/WPF → Tauri/Rust), and unified five platform SDKs onto a single Rust core through FFI and WebAssembly. Before that, I built V2X / C-ITS software for national R&D projects and researched authentication and applied cryptography at Sejong University's Information Security Lab.

  M.S. in Information Security · 8 peer-reviewed publications · 5 patents filed (4 granted)

  I am most skilled in: <mark>Rust</mark> <mark>C#</mark> <mark>Kotlin / Android</mark> <mark>Bluetooth LE</mark> <mark>FFI / WASM</mark>

