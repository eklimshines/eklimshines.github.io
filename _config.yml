          **Hybrid V2X Communication Module for Autonomous Driving** — KEIT · Nov 2018 – Dec 2018 (freelance)<br>
          *Embedded C, C# (WinForms) · solo · 100% contribution*

          - Developed Hybrid V2X (WAVE + legacy LTE) terminal software for WAVE and LTE transmit/receive.
          - Built a Windows monitoring program for Hybrid V2X PVD (Probe Vehicle Data) and roadside units.

          **Android App for C-ITS Service Display** — internal project · Mar 2018 – Aug 2018<br>
          *Java, Android · solo · 100% contribution*

          - Replaced the navigation-based display from the C-ITS pilot program with an Android tablet app.
          - Developed TCP/UDP communication between Android and the V2X terminal.
          - Decoded and parsed SAE J2735 messages (BSM, TIM, RSA) via ASN.1, and implemented the C-ITS service decision logic.

          **ITS-G5 V2X System & Services for the European Message Set (CAM, DENM)** — MOTIE International Joint R&D · Sep 2016 – Aug 2018<br>
