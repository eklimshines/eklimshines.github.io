          Researched security problems grounded in core information-security techniques, alongside SW development for national research projects. Filed 5 patents (4 granted).

          **Android App Wrapping** — internal lab project · Sep 2020 – Feb 2021<br>
          *Python · team of 2 · 50% contribution*

          - Researched adding and managing security features in Android apps without their original source code.
          - Analyzed Smali code and APK structure to support apps that existing wrapping tools could not handle.
          - Fixed failures when injecting security code by converting instructions from 4-bit to 8-bit register forms.
          - Delivered Python scripts that automate app wrapping.

          **IT Convergence Technology for Intelligent UAVs** — IITP · Feb 2020 – Dec 2020<br>
          *C, Raspberry Pi, PBC (Pairing-Based Cryptography) library · solo · 100% contribution*

          - Authenticated UAV controllers using the peripheral devices around them.
          - Implemented and tested the scheme over Wi-Fi and Bluetooth, using ID-based Sakai–Kasahara key exchange with AES.
          - Led to 4 patent filings: drone authentication, drone rental, vehicle verification, and neighbor-device authentication.

          **Functional Signature Design and Applications** — IITP · Jun 2019 – Jan 2021<br>
          *C, Raspberry Pi, PBC library · team of 2 · 50% contribution*

          - Applied functional signatures to ID-based UAV authentication and benchmarked them against existing ID-based schemes.
          - Resulted in a paper in *The Computer Journal* and a signcryption patent (granted 2022).

          **Blockchain-based Security Enhancement for UAVs** — NRF · Jun 2020 – Feb 2021

          - Studied countermeasures to UAV security threats using machine learning and blockchain.

