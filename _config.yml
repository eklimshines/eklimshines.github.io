        title: bHaptics
        sub_title: Software Developer, R&D Center
        caption: Dec 2021 – Present
        link: https://www.bhaptics.com
        link_text: bhaptics.com
        quote: >
          Primary developer for the flagship haptics player and cross-platform SDK · Seoul, South Korea
        description: | # this will include new lines to allow paragraphs
          - Own end-to-end development of **bHaptics Player**, a consumer desktop app (~5,000 MAU) driving 12 haptic hardware models over Bluetooth LE, across three generations (1.x → 3.x).
          - **Player 3.x (Tauri + Rust):** validated the stack with a firmware-updater PoC, then built ~50% of the rearchitecture — the entire Rust core (Bluetooth, haptics engine, WebSocket) on a message–action pattern — cutting idle CPU from ~10% to ~2%.
          - **Player 2.x (.NET Framework / WPF):** led development (~80%), expanding a device-only utility into a community platform (game lists, audio-profile sharing); earlier maintained 1.x, adding USB support and Themida anti-decompilation packing.
          - **SDK 2.0:** redesigned the open-source SDK into a closed, API-driven architecture with C++ TOTP authentication; unified C, C#, Python, Java/Kotlin and Web SDKs onto one Rust core via cbindgen, Interoptopus, UniFFI and WASM.
          - Maintained and extended the **Android SDK**, including a Rust-based NDK module for audio capture; mentored a junior engineer who now owns it.
          - Drove **ISO 27001** certification and ongoing internal security operations.

